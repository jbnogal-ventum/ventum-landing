<!DOCTYPE html>

<html lang="en">
<head>
	<!-- Meta -->
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Ventum Software combines product strategy, software development, and artificial intelligence to build scalable digital solutions. Our new website is on its way.">
	<meta name="author" content="Ventum Software">
	<!-- Page Title -->
	<title>Ventum Software | Coming soon</title>
	<!-- Favicon Icon -->
	<link rel="icon" type="image/png" href="images/ventum-favicon.png">
	<!-- Google Fonts Css-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
	<!--
		Temporary "under construction" page.
		The full landing page lives in landing.html — to restore it, rename it back to index.html.
	-->
	<style>
		:root{
			--primary-color	: #15161B;
			--secondary-color	: #F7F8FD;
			--text-color		: #5E616A;
			--accent-color		: #0062DD;
			--accent-secondary	: #1283FF;
			--ease-out		: cubic-bezier(0.22, 1, 0.36, 1);
		}

		*{
			box-sizing: border-box;
		}

		html, body{
			height: 100%;
			margin: 0;
		}

		body{
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			padding: 40px 24px;
			font-family: "Manrope", sans-serif;
			color: var(--text-color);
			background: var(--secondary-color);
			overflow-x: hidden;
		}

		.vt-uc-canvas{
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			z-index: 0;
			pointer-events: none;
		}

		.vt-uc{
			position: relative;
			z-index: 1;
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			text-align: center;
			max-width: 760px;
			margin: 0 auto;
		}

		.vt-uc-logo{
			display: block;
			width: 190px;
			height: auto;
			margin-bottom: 64px;
		}

		.vt-uc-tag{
			display: inline-flex;
			align-items: center;
			gap: 10px;
			margin: 0 0 24px;
			font-size: 13px;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			color: var(--accent-color);
		}

		.vt-uc-tag i{
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--accent-color);
			animation: vt-pulse 1.8s ease-out infinite;
		}

		@keyframes vt-pulse{
			0%{ box-shadow: 0 0 0 0 rgba(0, 98, 221, 0.5); }
			100%{ box-shadow: 0 0 0 10px rgba(0, 98, 221, 0); }
		}

		.vt-uc h1{
			margin: 0 0 24px;
			font-size: 64px;
			font-weight: 800;
			line-height: 1.04em;
			letter-spacing: -0.045em;
			color: var(--primary-color);
		}

		.vt-uc h1 span{
			color: var(--accent-color);
		}

		.vt-uc p{
			max-width: 560px;
			margin: 0 0 40px;
			font-size: 20px;
			line-height: 1.5em;
		}

		.vt-uc-mail{
			display: inline-flex;
			flex-direction: column;
			gap: 4px;
			padding: 22px 34px;
			border-radius: 24px;
			background: var(--primary-color);
			text-decoration: none;
			transition: transform 0.4s var(--ease-out);
		}

		.vt-uc-mail:hover{
			transform: translateY(-4px);
		}

		.vt-uc-mail:focus-visible{
			outline: 2px solid var(--accent-color);
			outline-offset: 3px;
		}

		.vt-uc-mail small{
			font-size: 14px;
			color: rgba(255, 255, 255, 0.6);
		}

		.vt-uc-mail strong{
			font-size: 24px;
			color: #FFFFFF;
			transition: color 0.3s;
		}

		.vt-uc-mail:hover strong{
			color: var(--accent-secondary);
		}

		.vt-uc-footer{
			position: relative;
			z-index: 1;
			margin-top: 40px;
			text-align: center;
			font-size: 14px;
		}

		/* Gentle entrance */
		.vt-uc > *{
			animation: vt-rise 0.9s var(--ease-out) both;
		}

		.vt-uc > *:nth-child(2){ animation-delay: 0.1s; }
		.vt-uc > *:nth-child(3){ animation-delay: 0.2s; }
		.vt-uc > *:nth-child(4){ animation-delay: 0.3s; }
		.vt-uc > *:nth-child(5){ animation-delay: 0.4s; }

		@keyframes vt-rise{
			from{ opacity: 0; transform: translateY(24px); }
			to{ opacity: 1; transform: none; }
		}

		@media only screen and (max-width: 767px){
			.vt-uc-logo{
				width: 150px;
				margin-bottom: 48px;
			}

			.vt-uc h1{
				font-size: 40px;
			}

			.vt-uc p{
				font-size: 17px;
			}

			.vt-uc-mail strong{
				font-size: 20px;
			}
		}

		@media (prefers-reduced-motion: reduce){
			.vt-uc > *,
			.vt-uc-tag i{
				animation: none;
			}
		}
	</style>
</head>
<body>
	<canvas class="vt-uc-canvas" aria-hidden="true"></canvas>

	<main class="vt-uc">
		<img class="vt-uc-logo" src="images/ventum-logo-crop.png" alt="Ventum Software">
		<span class="vt-uc-tag"><i></i>Under construction</span>
		<h1>Something new is <br> <span>on its way.</span></h1>
		<p>We're building our new website. In the meantime, we'd love to hear about your product, your challenge, or your next idea.</p>
		<a class="vt-uc-mail" href="mailto:info@ventum.dev">
			<small>Get in touch</small>
			<strong>info@ventum.dev</strong>
		</a>
	</main>

	<footer class="vt-uc-footer">
		<p>Copyright &copy; <span class="vt-year">2026</span> Ventum Software. All rights reserved.</p>
	</footer>

	<script>
		(function () {
			"use strict";

			var year = document.querySelector(".vt-year");
			if (year) year.textContent = new Date().getFullYear();

			/* Slow "wind" lines in the background, same idea as the landing hero */
			var canvas = document.querySelector(".vt-uc-canvas");
			if (!canvas || !canvas.getContext) return;
			var ctx = canvas.getContext("2d");
			var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
			var w = 0, h = 0, t = 0, raf = 0;
			var lines = [];
			var COUNT = 14;

			for (var i = 0; i < COUNT; i++) {
				lines.push({
					base: (i + 1) / (COUNT + 1),
					amp: 10 + Math.random() * 22,
					freq: 0.0016 + Math.random() * 0.0018,
					speed: 0.15 + Math.random() * 0.25,
					phase: Math.random() * Math.PI * 2,
					accent: i === 4 ? "rgba(0, 98, 221, 0.28)" : i === 10 ? "rgba(18, 131, 255, 0.35)" : null
				});
			}

			function resize() {
				var dpr = Math.min(window.devicePixelRatio || 1, 2);
				w = window.innerWidth; h = window.innerHeight;
				canvas.width = Math.round(w * dpr);
				canvas.height = Math.round(h * dpr);
				ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
				draw();
			}

			function draw() {
				ctx.clearRect(0, 0, w, h);
				var step = w < 700 ? 18 : 12;
				lines.forEach(function (l) {
					var by = l.base * h;
					ctx.beginPath();
					for (var x = -step; x <= w + step; x += step) {
						var y = by
							+ Math.sin(x * l.freq + t * l.speed + l.phase) * l.amp
							+ Math.sin(x * l.freq * 2.3 - t * l.speed * 0.6) * (l.amp * 0.35);
						if (x === -step) ctx.moveTo(x, y); else ctx.lineTo(x, y);
					}
					ctx.lineWidth = l.accent ? 1.5 : 1;
					ctx.strokeStyle = l.accent || "rgba(21, 22, 27, 0.07)";
					ctx.stroke();
				});
			}

			function loop() {
				t += 0.016;
				draw();
				raf = requestAnimationFrame(loop);
			}

			window.addEventListener("resize", resize);
			resize();
			if (reduceMotion) return;
			raf = requestAnimationFrame(loop);
			document.addEventListener("visibilitychange", function () {
				cancelAnimationFrame(raf);
				if (!document.hidden) raf = requestAnimationFrame(loop);
			});
		})();
	</script>
</body>
</html>
